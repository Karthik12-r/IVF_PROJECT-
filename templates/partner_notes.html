{% extends "base.html" %}

{% block title %}Shared Notes{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="fas fa-sticky-note me-2"></i>Shared Notes</h2>
        <a href="{{ url_for('partner_dashboard') }}" class="btn btn-outline-secondary btn-sm">Back to dashboard</a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Note</button>
            </form>
        </div>
    </div>

    <div class="row g-3">
        {% for note in notes %}
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5>{{ note.title }}</h5>
                    <p class="mb-0">{{ note.description }}</p>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="alert alert-light border mb-0">No shared notes yet.</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
